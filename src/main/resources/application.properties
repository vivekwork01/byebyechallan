spring.application.name=byebyechallan
server.port=8081
app.base-url=http://localhost:8081


spring.datasource.url=jdbc:mysql://localhost:3306/byebyechallan?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=Root@123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true



# Logging configuration
logging.level.root=INFO
logging.level.com.byebyechallan=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.com.example.auth=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
logging.level.org.springframework.security=DEBUG

# Swagger API Docs
springdoc.api-docs.path=/api-docs
#server.servlet.context-path=/api

#RabbitMQ Configuration
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# RabbitMQ Exchange and Queue Configuration
rabbitmq.exchange=sms-email-whatsapp-exchange
rabbitmq.sms.routing-key=sms-routing-key
rabbitmq.sms.queue=sms-queue
rabbitmq.email.routing-key=email-routing-key
rabbitmq.email.queue=email-queue
rabbitmq.whatsapp.routing-key=whatsapp-routing-key
rabbitmq.whatsapp.queue=whatsapp-queue
